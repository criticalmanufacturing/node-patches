name: build

# Builds the patched runtimes for win-x64 and linux-x64, verifies them and,
# on a manual run with "publish", creates one GitHub release per version with
# build-provenance attestations.
on:
  workflow_dispatch:
    inputs:
      versions:
        description: Comma-separated versions (folder names) to build
        default: v10.24.1,v12.22.12,v14.21.3,v16.20.2,v18.20.8,v20.20.2
      platforms:
        description: Comma-separated platforms (win-x64, linux-x64)
        default: win-x64,linux-x64
      publish:
        description: Create GitHub releases from the results
        type: boolean
        default: false
      sign:
        description: Authenticode-sign node.exe with the DigiCert KeyLocker key (publish runs only; needs the "signing" environment)
        type: boolean
        default: true
  pull_request:
    paths: ['v*/**', 'tools/**', 'tests/**', '.github/workflows/build.yml']

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.p.outputs.versions }}
      win: ${{ steps.p.outputs.win }}
      linux: ${{ steps.p.outputs.linux }}
    steps:
      - id: p
        env:
          VERSIONS: ${{ inputs.versions || 'v10.24.1,v12.22.12,v14.21.3,v16.20.2,v18.20.8,v20.20.2' }}
          PLATFORMS: ${{ inputs.platforms || 'win-x64,linux-x64' }}
        run: |
          echo "versions=$(jq -cn --arg v "$VERSIONS" '$v | gsub("\\s";"") | split(",")')" >> "$GITHUB_OUTPUT"
          echo "win=$([[ ",$PLATFORMS," == *",win-x64,"* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "linux=$([[ ",$PLATFORMS," == *",linux-x64,"* ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.win == 'true'
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Read build.json
        id: cfg
        shell: pwsh
        run: |
          $c = Get-Content "${{ matrix.version }}/build.json" -Raw | ConvertFrom-Json
          "component=$($c.vs_component)" >> $env:GITHUB_OUTPUT
          "vcvars=$($c.vcvars_ver)" >> $env:GITHUB_OUTPUT
          "python=$($c.python)" >> $env:GITHUB_OUTPUT

      - name: Install the MSVC toolset of this release line
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vs = & "$installer\vswhere.exe" -latest -property installationPath
          Write-Host "Visual Studio: $vs"
          # vcvarsall -vcvars_ver=<v> picks the newest MSVC folder whose name contains <v>.
          $have = Get-ChildItem "$vs\VC\Tools\MSVC" -Directory | Where-Object Name -like '*${{ steps.cfg.outputs.vcvars }}*'
          if ($have) { Write-Host "MSVC ${{ steps.cfg.outputs.vcvars }} already installed: $($have.Name -join ', ')"; exit 0 }
          $p = Start-Process "$installer\vs_installer.exe" -Wait -PassThru -ArgumentList `
            'modify', '--installPath', "`"$vs`"", '--add', '${{ steps.cfg.outputs.component }}', '--quiet', '--norestart', '--nocache'
          if ($p.ExitCode -notin 0, 3010) { throw "VS installer exited with $($p.ExitCode)" }
          Get-ChildItem "$vs\VC\Tools\MSVC" | Select-Object -ExpandProperty Name

      - name: Fetch Python and NASM
        shell: pwsh
        run: |
          $t = 'C:\nbtools'; New-Item -ItemType Directory -Force $t | Out-Null
          $pkg = if ('${{ steps.cfg.outputs.python }}' -eq '2.7') { 'python2/2.7.18' } else { 'python/3.8.10' }
          Invoke-WebRequest "https://www.nuget.org/api/v2/package/$pkg" -OutFile "$t\py.zip"
          Expand-Archive "$t\py.zip" "$t\py"
          Invoke-WebRequest 'https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/win64/nasm-2.16.03-win64.zip' -OutFile "$t\nasm.zip"
          Expand-Archive "$t\nasm.zip" $t
          & "$t\py\tools\python.exe" --version
          & "$t\nasm-2.16.03\nasm.exe" -v
          Get-PSDrive C, D -ErrorAction SilentlyContinue | Format-Table Name, @{n='FreeGB'; e={[math]::Round($_.Free / 1GB)}}

      - name: Build and verify
        shell: pwsh
        run: .\tools\build.ps1 -Version ${{ matrix.version }} -PythonDir C:\nbtools\py\tools -NasmDir C:\nbtools\nasm-2.16.03 -WorkDir C:\nb

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ matrix.version }}-win-x64
          path: C:/nb/build-${{ matrix.version }}.log

      - name: Package
        shell: pwsh
        run: |
          $d = Get-ChildItem C:\nb\dist -Directory | Select-Object -First 1
          New-Item -ItemType Directory -Force out | Out-Null
          Move-Item "$($d.FullName)\node.pdb" .
          Compress-Archive -Path $d.FullName -DestinationPath "out\$($d.Name).zip"
          Compress-Archive -Path node.pdb -DestinationPath "out\$($d.Name)-pdb.zip"
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}-win-x64
          path: out/*
          retention-days: 30

  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare work dir
        run: |
          sudo mkdir -p /mnt/nb && sudo chown "$USER" /mnt/nb
          df -h / /mnt

      - name: Build and verify
        run: bash tools/build-linux.sh ${{ matrix.version }} /mnt/nb

      # Negative control: the same tests must fail on the official binary, which
      # shows they detect each vulnerability rather than passing on any build.
      - name: Show the official binary is vulnerable
        run: |
          tag=$(jq -r .tag ${{ matrix.version }}/build.json)
          f=node-$tag-linux-x64.tar.xz
          cd /mnt/nb
          curl -fsSLO "https://nodejs.org/dist/$tag/$f"
          curl -fsSL "https://nodejs.org/dist/$tag/SHASUMS256.txt" | grep " $f\$" | sha256sum -c -
          tar -xJf "$f"
          "/mnt/nb/node-$tag-linux-x64/bin/node" "$GITHUB_WORKSPACE/tests/run.js" --expect vulnerable

      - name: Package
        run: |
          mkdir -p out
          cp /mnt/nb/dist/*.tar.xz out/
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}-linux-x64
          path: out/*
          retention-days: 30

  # Authenticode-signs node.exe with the company's DigiCert KeyLocker key. Runs only
  # on manual publish runs, in the protected "signing" environment (main branch only,
  # required reviewers), so pull requests and the build jobs never see the secrets.
  sign:
    needs: [plan, windows]
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.publish && inputs.sign &&
      needs.plan.outputs.win == 'true'
    runs-on: windows-2022
    environment: signing
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.version }}-win-x64
          path: in

      - name: Unpack
        id: unpack
        shell: pwsh
        run: |
          $zip = Get-ChildItem in -Filter *-win-x64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName work
          $dir = (Get-ChildItem work -Directory | Select-Object -First 1).FullName
          if ((Get-AuthenticodeSignature "$dir\node.exe").Status -ne 'NotSigned') { throw "$dir\node.exe is already signed" }
          "dir=$dir" >> $env:GITHUB_OUTPUT
          "zip=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Write the DigiCert client certificate
        shell: pwsh
        env:
          P12_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          CHECK_SM_HOST: ${{ vars.SM_HOST }}
          CHECK_SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}
          CHECK_SIGNER_NAME: ${{ vars.SIGNER_NAME }}
        run: |
          # Without these the action would install its tools but not sign, and the check would be skipped.
          foreach ($n in 'P12_B64', 'CHECK_SM_HOST', 'CHECK_SM_KEYPAIR_ALIAS', 'CHECK_SIGNER_NAME') {
            if (-not [Environment]::GetEnvironmentVariable($n)) { throw "$($n -replace '^CHECK_', '' -replace '^P12_B64$', 'SM_CLIENT_CERT_FILE_B64') is not set; see README > Code signing." }
          }
          $f = Join-Path $env:RUNNER_TEMP 'sm_client.p12'
          [IO.File]::WriteAllBytes($f, [Convert]::FromBase64String($env:P12_B64))
          "SM_CLIENT_CERT_FILE=$f" >> $env:GITHUB_ENV

      # Simple signing mode: smctl signs with the KeyLocker keypair, SHA-256, timestamped.
      - name: Sign node.exe
        uses: digicert/code-signing-software-trust-action@fae23a455ba4bde62b64fd7cb2f81ade788f5a95 # v1.2.1
        with:
          simple-signing-mode: true
          input: ${{ steps.unpack.outputs.dir }}\node.exe
          keypair-alias: ${{ vars.SM_KEYPAIR_ALIAS }}
        env:
          SM_HOST: ${{ vars.SM_HOST }}
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}

      - name: Remove the client certificate
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP 'sm_client.p12') -ErrorAction SilentlyContinue

      - name: Check the signature, re-run the checks, repackage
        shell: pwsh
        env:
          SIGNER: ${{ vars.SIGNER_NAME }}
        run: |
          $dir = '${{ steps.unpack.outputs.dir }}'
          .\tools\verify.ps1 -Node "$dir\node.exe" -Version ${{ matrix.version }} -Signer $env:SIGNER
          # Signing changed node.exe: refresh its line in SHA256SUMS.txt (node.pdb is unchanged).
          $h = (Get-FileHash "$dir\node.exe").Hash.ToLower()
          $sums = "$dir\SHA256SUMS.txt"
          (Get-Content $sums) -replace '^[0-9a-f]{64}  node\.exe$', "$h  node.exe" | Set-Content -Encoding ascii $sums
          if (-not (Select-String -Path $sums -SimpleMatch "$h  node.exe")) { throw 'SHA256SUMS.txt was not updated' }
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path $dir -DestinationPath "out\${{ steps.unpack.outputs.zip }}"
          Copy-Item in\*-pdb.zip out\
          Get-ChildItem out | Format-Table Name, Length

      # Replaces the unsigned artifact of the windows job, so the release picks up the signed zip.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version }}-win-x64
          path: out/*
          retention-days: 30
          overwrite: true

  release:
    needs: [plan, windows, linux, sign]
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.publish &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'artifacts/*.zip, artifacts/*.tar.xz'

      - name: Create one release per version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ needs.plan.outputs.versions }}
          SIGNED: ${{ needs.sign.result == 'success' }}
          SIGNER: ${{ vars.SIGNER_NAME }}
        run: |
          if [ "$SIGNED" = true ]; then
            sigline="- Windows \`node.exe\` is Authenticode-signed by $SIGNER (DigiCert) and timestamped. Provenance: \`gh attestation verify <file> --repo ${{ github.repository }}\`."
          else
            sigline="- Binaries are not Authenticode-signed. Check provenance with \`gh attestation verify <file> --repo ${{ github.repository }}\`."
          fi
          # The "Latest" badge goes to the highest Node.js version in the repo, not the newest release.
          highest=$(ls -d v*/ | tr -d / | sort -V | tail -1)
          for v in $(jq -r '.[]' <<<"$VERSIONS"); do
            level=$(jq -r .patch_level "$v/build.json")
            cves=$(jq -r '.cves | join(", ")' "$v/build.json")
            base=${v#v}
            tag="v$base+cm.$level"
            # A release is immutable once published: bump patch_level to ship a new build.
            if gh release view "$tag" >/dev/null 2>&1; then echo "$tag already released, skipping"; continue; fi
            mkdir -p "rel/$v"
            cp artifacts/node-v$base-cm.$level-* "rel/$v/"
            (cd "rel/$v" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
            cat > "rel/notes-$v.md" <<EOF
          Node.js $base with security backports, built from upstream tag \`$v\` plus the patches in [\`$v/patches\`](https://github.com/${{ github.repository }}/tree/${{ github.sha }}/$v/patches).

          - \`node -v\` prints \`$tag\`. \`process.config.variables.cm_patches\`: \`$cves\`.
          - Fixes: $cves. Details: [docs](https://github.com/${{ github.repository }}/tree/${{ github.sha }}/docs).
          - To check a binary, run \`node tests/run.js\` from a checkout of this repo with that binary. Every CVE must show FIXED.
          $sigline
          - These release lines are end-of-life: only the CVEs listed above are fixed.
          EOF
            gh release create "$tag" rel/$v/* --target "$GITHUB_SHA" \
              --title "Node.js $tag" --notes-file "rel/notes-$v.md" \
              --latest=$([ "$v" = "$highest" ] && echo true || echo false)
          done
